<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTAU / OpenUTAU 工程配布站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23333'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3EU%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { max-width: 900px; margin: 20px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .allowed { font-size: 14px; color: #666; margin-top: 0; }
  .upload-area { border: 2px dashed #444; padding: 30px; text-align: center; margin: 20px 0; border-radius: 8px; cursor: pointer; }
  .upload-area.active { background: #eef; border-color: #0066cc; }
  input[type=file] { display: none; }
  input[type=checkbox] { width: 16px; height: 16px; vertical-align: middle; accent-color: #0066cc; }
  button { padding: 8px 16px; min-height: 44px; cursor: pointer; border: 1px solid #888; background: #f7f7f7; border-radius: 4px; font-size: 14px; }
  button:hover:not(:disabled) { background: #eee; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .agree-box { margin: 20px 0; font-size: 14px; }
  .agree-box label { display: inline-block; padding: 10px 0; line-height: 1.6; }
  .file-list { margin-top: 30px; }
  .group { margin: 16px 0; padding: 12px; border: 1px solid #ddd; border-radius: 4px; }
  .group h2 { font-size: 16px; margin: 0 0 8px; }
  .file-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #eee; }
  .file-item:last-child { border-bottom: none; }
  .file-item .name { flex: 1; word-break: break-all; font-size: 14px; }
  a { color: #0066cc; }
  a.disabled { color: #888; pointer-events: none; text-decoration: none; }
  .empty { color: #999; font-size: 13px; padding: 6px 0; }
  .msg { min-height: 20px; font-size: 14px; }
  .msg.error { color: #c00; }
  .msg.ok { color: #060; }
</style>
</head>
<body>
<h1>UTAU / OpenUTAU 工程配布站</h1>
<p class="allowed">允许上传：.ust .ustx .vsq .vsqx .vpr .pp2 .pp3 .zip .rar（文件自动加时间戳，不会覆盖已有文件）</p>

<div id="drop" class="upload-area">
  <p>拖拽多个文件到此处批量上传，或点击选择多个文件</p>
  <button id="pickBtn" type="button">选择文件</button>
  <input type="file" id="fileIn" multiple>
</div>

<div class="agree-box">
  <label><input type="checkbox" id="agree"> 我承诺我在二次发布时会标注来自哪里的网站取得的文件，若我违规上面的条约，我同意承担所有法律责任</label>
</div>

<p><button id="uploadBtn" type="button" disabled>上传文件</button></p>
<p id="msg" class="msg"></p>

<div class="file-list">
  <h2>文件列表</h2>
  <div class="group"><h2>UTAU工程 (.ust)</h2><div id="list-ust"></div></div>
  <div class="group"><h2>OpenUTAU工程 (.ustx)</h2><div id="list-ustx"></div></div>
  <div class="group"><h2>Vocaloid工程 (.vsq/.vsqx/.vpr/.pp2/.pp3)</h2><div id="list-vocaloid"></div></div>
  <div class="group"><h2>压缩包（声库）(.zip/.rar)</h2><div id="list-ziprar"></div></div>
</div>

<script>
// ★★★ 必改项：替换为你的 Cloudflare Pages 函数地址，例如 https://utau.pages.dev/upload
const API_ENDPOINT = "https://utau-4oo.pages.dev/upload";

const fileInput = document.getElementById("fileIn");
const pickBtn = document.getElementById("pickBtn");
const dropArea = document.getElementById("drop");
const uploadBtn = document.getElementById("uploadBtn");
const agreeCheck = document.getElementById("agree");
const msgBox = document.getElementById("msg");

const MAX_SIZE = 50 * 1024 * 1024; // 与后端 functions/upload.js 的 MAX_RAW_SIZE 保持一致
const allowExt = ["ust", "ustx", "vsq", "vsqx", "vpr", "pp2", "pp3", "zip", "rar"];

let selectedFiles = [];

/* ---------- 选择文件 ---------- */
pickBtn.onclick = (e) => { e.stopPropagation(); fileInput.click(); };
dropArea.onclick = () => fileInput.click();
dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add("active"); };
dropArea.ondragleave = () => dropArea.classList.remove("active");
dropArea.ondrop = (e) => {
  e.preventDefault();
  dropArea.classList.remove("active");
  if (e.dataTransfer.files.length > 0) {
    fileInput.files = e.dataTransfer.files;
    selectFiles(e.dataTransfer.files);
  }
};
fileInput.onchange = () => { if (fileInput.files.length > 0) selectFiles(fileInput.files); };

function selectFiles(fileList) {
  selectedFiles = [];
  const rejected = [];
  for (const file of fileList) {
    const ext = file.name.split(".").pop().toLowerCase();
    if (!allowExt.includes(ext)) {
      rejected.push(file.name + "（类型不允许）");
    } else if (file.size > MAX_SIZE) {
      rejected.push(file.name + "（超过 " + Math.round(MAX_SIZE / 1024 / 1024) + " MB）");
    } else {
      selectedFiles.push(file);
    }
  }
  if (selectedFiles.length > 0) {
    const totalSize = selectedFiles.reduce((s, f) => s + f.size, 0);
    let msg = "已选中 " + selectedFiles.length + " 个文件，共 " + formatSize(totalSize);
    if (rejected.length > 0) msg += "；已跳过 " + rejected.length + " 个：" + rejected.join("、");
    setMsg(msg, rejected.length > 0 ? "error" : "ok");
  } else {
    setMsg("没有可用的文件：" + rejected.join("、"), "error");
  }
  refreshState();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}

function setMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = "msg" + (type ? " " + type : "");
}

/* ---------- 协议勾选：控制上传按钮与下载链接 ---------- */
function refreshState() {
  uploadBtn.disabled = !(agreeCheck.checked && selectedFiles.length > 0);
  document.querySelectorAll(".download-link").forEach((link) => {
    if (agreeCheck.checked) {
      link.classList.remove("disabled");
      link.tabIndex = 0;
    } else {
      link.classList.add("disabled");
      link.tabIndex = -1;
    }
  });
}
agreeCheck.onchange = refreshState;

/* ---------- 上传 ---------- */
function arrayBufferToBase64(buffer) {
  // 分块拼接，避免大文件用展开运算符打爆调用栈
  let binary = "";
  const bytes = new Uint8Array(buffer);
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

uploadBtn.onclick = async () => {
  if (selectedFiles.length === 0 || !agreeCheck.checked) return;
  uploadBtn.disabled = true;
  const total = selectedFiles.length;
  const succeeded = [];
  const failed = [];
  for (let i = 0; i < total; i++) {
    const file = selectedFiles[i];
    setMsg("上传中… (" + (i + 1) + "/" + total + ")：" + file.name + "，请勿关闭页面", "");
    try {
      const base64 = arrayBufferToBase64(await file.arrayBuffer());
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, data: base64 }),
      });
      let ret = null;
      try { ret = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
      if (ret && ret.ok) {
        succeeded.push(file.name);
      } else {
        failed.push(file.name + "（" + (ret && ret.msg ? ret.msg : "HTTP " + res.status) + "）");
      }
    } catch (err) {
      failed.push(file.name + "（网络错误：" + err.message + "）");
    }
  }
  let msg = "完成：成功 " + succeeded.length + " 个";
  if (failed.length > 0) msg += "，失败 " + failed.length + " 个（" + failed.join("；") + "）";
  setMsg(msg, failed.length > 0 ? "error" : "ok");
  selectedFiles = [];
  fileInput.value = "";
  loadFileList();
  refreshState();
};

/* ---------- 文件列表 ---------- */
async function loadFileList() {
  try {
    const res = await fetch(API_ENDPOINT + "?list=1");
    const data = await res.json();
    const files = (data && data.files) ? data.files : [];
    renderList("list-ust", files, ["ust"]);
    renderList("list-ustx", files, ["ustx"]);
    renderList("list-vocaloid", files, ["vsq", "vsqx", "vpr", "pp2", "pp3"]);
    renderList("list-ziprar", files, ["zip", "rar"]);
  } catch (err) {
    setMsg("加载文件列表失败：" + err.message + "（请检查 API_ENDPOINT 配置）", "error");
  }
  refreshState();
}

function renderList(listId, files, exts) {
  const container = document.getElementById(listId);
  container.innerHTML = "";
  const matched = files.filter((f) => exts.indexOf(f.name.split(".").pop().toLowerCase()) !== -1);
  if (matched.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "暂无文件";
    container.appendChild(empty);
    return;
  }
  matched.forEach((item) => {
    const row = document.createElement("div");
    row.className = "file-item";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    name.title = item.name;

    const link = document.createElement("a");
    link.className = "download-link";
    link.href = item.download || item.raw;
    link.textContent = "下载";
    link.target = "_blank";
    link.rel = "noopener";
    link.download = item.name;

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.textContent = "复制直链";
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(item.raw);
        copyBtn.textContent = "已复制";
        setTimeout(() => { copyBtn.textContent = "复制直链"; }, 1500);
      } catch (e) {
        setMsg("复制失败，请手动复制链接", "error");
      }
    };

    row.appendChild(name);
    row.appendChild(link);
    row.appendChild(copyBtn);
    container.appendChild(row);
  });
}

loadFileList();
// 记录页面访问
navigator.sendBeacon(API_ENDPOINT + "?track=1", JSON.stringify({}));
</script>
<div style="text-align:center;margin-top:40px;padding-top:16px;border-top:1px solid #eee;font-size:13px;color:#888;line-height:1.8">
  <div>微信：18946843204</div>
  <div>QQ：2192465687</div>
  <div style="margin-top:8px;color:#c00;font-size:12px">没事别打电话和加微信骚扰我，要不然就等着网站拉黑吧，或者一顿骂</div>
</div>
</body>
</html>
