<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 - UTAU 配布站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23333'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3EU%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { max-width: 900px; margin: 20px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .allowed { font-size: 14px; color: #666; margin-top: 0; line-height: 1.7; }
  .card { border: 2px dashed #444; padding: 30px; margin: 20px 0; border-radius: 8px; background: #fcfcfc; }
  .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
  .tab { flex: 1; padding: 12px; border: 1.5px solid #ddd; background: #f7f7f7; border-radius: 8px; font-size: 15px; cursor: pointer; color: #555; }
  .tab.active { border-color: #0066cc; background: #eef4fb; color: #0066cc; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; color: #333; margin-bottom: 8px; font-weight: 500; }
  .field input { width: 100%; padding: 14px 16px; border: 1.5px solid #e0e0e0; border-radius: 8px; background: #f5f5f5; font-size: 16px; outline: none; }
  .field input:focus { border-color: #0066cc; background: #fff; }
  .code-row { display: flex; gap: 10px; }
  .code-row input { flex: 1; }
  .code-row button { flex-shrink: 0; padding: 8px 14px; min-height: 48px; cursor: pointer; border: 1px solid #888; background: #f7f7f7; border-radius: 8px; font-size: 14px; white-space: nowrap; }
  button.main { width: 100%; padding: 12px; min-height: 48px; cursor: pointer; border: 1px solid #0066cc; background: #0066cc; color: #fff; border-radius: 8px; font-size: 16px; font-weight: 600; }
  button.main:hover:not(:disabled) { background: #0052a3; }
  button.main:disabled, .code-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { min-height: 20px; font-size: 14px; margin: 10px 0 0; }
  .msg.error { color: #c00; }
  .msg.ok { color: #060; }
  .logged-info { font-size: 15px; line-height: 1.8; }
  .logged-info b { color: #0066cc; }
  .nav { font-size: 14px; margin: 24px 0; }
  a { color: #0066cc; }
  footer { text-align: center; margin-top: 40px; padding-top: 16px; border-top: 1px solid #eee; font-size: 13px; color: #888; line-height: 1.8; }
  footer .warn { color: #c00; font-size: 12px; }
</style>
</head>
<body>
<h1>登录 / 注册</h1>
<p class="allowed">登录后可参与 UTAU / OpenUTAU 工程配布站的文件分享与下载。新用户输入邮箱获取验证码即可注册，无需额外设置。</p>

<div class="card">
  <div class="tabs">
    <button class="tab active" id="tabLogin" type="button">登录</button>
    <button class="tab" id="tabReg" type="button">注册</button>
  </div>

  <div id="loginForm">
    <div class="field">
      <label for="loginEmail">邮箱</label>
      <input type="email" id="loginEmail" placeholder="输入邮箱..." autocomplete="email">
    </div>
    <div class="field">
      <label for="loginPwd">密码</label>
      <input type="password" id="loginPwd" placeholder="输入密码..." autocomplete="current-password">
    </div>
    <p><button class="main" id="loginBtn" type="button">登录</button></p>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="regForm" style="display:none">
    <div class="field">
      <label for="regEmail">邮箱</label>
      <div class="code-row">
        <input type="email" id="regEmail" placeholder="输入邮箱..." autocomplete="email">
        <button id="sendBtn" type="button">发送验证码</button>
      </div>
    </div>
    <div class="field">
      <label for="regCode">邮箱验证码</label>
      <input type="text" id="regCode" placeholder="6 位数字验证码" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    </div>
    <div class="field">
      <label for="regPwd">密码</label>
      <input type="password" id="regPwd" placeholder="6~64 位密码" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="regPwd2">确认密码</label>
      <input type="password" id="regPwd2" placeholder="再次输入密码" autocomplete="new-password">
    </div>
    <p><button class="main" id="regBtn" type="button">注册并登录</button></p>
    <p id="regMsg" class="msg"></p>
  </div>
</div>

<div class="card" id="loggedCard" style="display:none">
  <p class="logged-info">已登录：<b id="meEmail"></b></p>
  <p><button class="main" id="logoutBtn" type="button">退出登录</button></p>
</div>

<p class="nav"><a href="../">← 返回主站</a></p>

<footer>
  <div>微信：18946843204</div>
  <div>QQ：2192465687</div>
  <div class="warn">没事别打电话和加微信骚扰我，要不然就等着网站拉黑吧，或者一顿骂</div>
</footer>

<script>
// ★★★ 必改项：替换为你的 Cloudflare Pages 函数地址，例如 https://utau-4oo.pages.dev/auth
const API = "https://utau-4oo.pages.dev/auth";
const SESSION_KEY = "utau_session";

const tabLogin = document.getElementById("tabLogin");
const tabReg = document.getElementById("tabReg");
const loginForm = document.getElementById("loginForm");
const regForm = document.getElementById("regForm");
const loginMsg = document.getElementById("loginMsg");
const regMsg = document.getElementById("regMsg");
const loggedCard = document.getElementById("loggedCard");
const meEmail = document.getElementById("meEmail");

function setMsg(el, text, type) {
  el.textContent = text;
  el.className = "msg" + (type ? " " + type : "");
}

function switchTab(which) {
  const isLogin = which === "login";
  tabLogin.classList.toggle("active", isLogin);
  tabReg.classList.toggle("active", !isLogin);
  loginForm.style.display = isLogin ? "block" : "none";
  regForm.style.display = isLogin ? "none" : "block";
  setMsg(loginMsg, "", "");
  setMsg(regMsg, "", "");
}
tabLogin.onclick = () => switchTab("login");
tabReg.onclick = () => switchTab("register");

function showLogged(email) {
  meEmail.textContent = email;
  loggedCard.style.display = "block";
  loginForm.style.display = "none";
  regForm.style.display = "none";
  tabLogin.classList.remove("active");
  tabReg.classList.remove("active");
}
function hideLogged() {
  loggedCard.style.display = "none";
  switchTab("login");
}

/* ---------- 登录 ---------- */
loginBtn.onclick = async () => {
  const email = loginEmail.value.trim().toLowerCase();
  const pwd = loginPwd.value;
  if (!email || !pwd) { setMsg(loginMsg, "请输入邮箱和密码", "error"); return; }
  loginBtn.disabled = true;
  setMsg(loginMsg, "登录中…", "");
  try {
    const res = await fetch(API + "?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: pwd }),
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem(SESSION_KEY, data.token);
      setMsg(loginMsg, "登录成功", "ok");
      showLogged(data.email);
    } else {
      setMsg(loginMsg, data.msg || "登录失败（HTTP " + res.status + "）", "error");
    }
  } catch (e) {
    setMsg(loginMsg, "网络错误：" + e.message, "error");
  } finally {
    loginBtn.disabled = false;
  }
};
loginPwd.addEventListener("keydown", (e) => { if (e.key === "Enter") loginBtn.click(); });

/* ---------- 发送验证码 ---------- */
sendBtn.onclick = async () => {
  const email = regEmail.value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setMsg(regMsg, "请输入正确的邮箱地址", "error");
    return;
  }
  sendBtn.disabled = true;
  setMsg(regMsg, "正在发送验证码…", "");
  try {
    const res = await fetch(API + "?action=sendcode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (data.ok) {
      setMsg(regMsg, data.msg || "验证码已发送", "ok");
    } else {
      setMsg(regMsg, data.msg || "发送失败（HTTP " + res.status + "）", "error");
      sendBtn.disabled = false;
    }
  } catch (e) {
    setMsg(regMsg, "网络错误：" + e.message, "error");
    sendBtn.disabled = false;
  }
  // 无论成败，进入 60 秒冷却倒计时
  if (sendBtn.disabled) {
    let sec = 60;
    const origin = sendBtn.textContent;
    sendBtn.textContent = "重新发送(" + sec + "s)";
    const timer = setInterval(() => {
      sec--;
      if (sec <= 0) {
        clearInterval(timer);
        sendBtn.textContent = origin;
        sendBtn.disabled = false;
      } else {
        sendBtn.textContent = "重新发送(" + sec + "s)";
      }
    }, 1000);
  }
};

/* ---------- 注册 ---------- */
regBtn.onclick = async () => {
  const email = regEmail.value.trim().toLowerCase();
  const code = regCode.value.trim();
  const pwd = regPwd.value;
  const pwd2 = regPwd2.value;
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setMsg(regMsg, "请输入正确的邮箱地址", "error"); return;
  }
  if (!/^\d{6}$/.test(code)) {
    setMsg(regMsg, "请输入 6 位验证码", "error"); return;
  }
  if (pwd.length < 6 || pwd.length > 64) {
    setMsg(regMsg, "密码需为 6~64 位", "error"); return;
  }
  if (pwd !== pwd2) {
    setMsg(regMsg, "两次输入的密码不一致", "error"); return;
  }
  regBtn.disabled = true;
  setMsg(regMsg, "注册中…", "");
  try {
    const res = await fetch(API + "?action=register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, code, password: pwd }),
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem(SESSION_KEY, data.token);
      setMsg(regMsg, "注册成功，已自动登录", "ok");
      showLogged(data.email);
    } else {
      setMsg(regMsg, data.msg || "注册失败（HTTP " + res.status + "）", "error");
    }
  } catch (e) {
    setMsg(regMsg, "网络错误：" + e.message, "error");
  } finally {
    regBtn.disabled = false;
  }
};
regPwd2.addEventListener("keydown", (e) => { if (e.key === "Enter") regBtn.click(); });

/* ---------- 退出 ---------- */
logoutBtn.onclick = async () => {
  const token = localStorage.getItem(SESSION_KEY);
  if (token) {
    try {
      await fetch(API + "?action=logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
    } catch (e) { /* 忽略 */ }
  }
  localStorage.removeItem(SESSION_KEY);
  hideLogged();
};

/* ---------- 页面加载时恢复登录态 ---------- */
(async () => {
  const token = localStorage.getItem(SESSION_KEY);
  if (!token) return;
  try {
    const res = await fetch(API + "?action=me&token=" + encodeURIComponent(token));
    const data = await res.json();
    if (data.ok) {
      showLogged(data.email);
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  } catch (e) { /* 网络异常时不打扰，保持表单态 */ }
})();
</script>
</body>
</html>
