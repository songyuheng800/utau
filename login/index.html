<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTAU 配布站 · 开放平台授权登录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121214'/%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%23f5c542' stroke-width='5'/%3E%3Ctext x='50' y='68' font-size='44' text-anchor='middle' fill='%23f5c542' font-family='Arial' font-weight='900'%3EU%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#121214;--card:#1d1d1f;--card2:#242426;--line:#333336;--txt:#e8e8ea;--dim:#8b8b90;--red:#e02424;--gold:#f5c542;--green:#3fb950;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 32px;text-align:center}
  .badge{display:inline-block;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:4px 16px;margin-bottom:20px;opacity:.9}
  h1{font-size:24px;margin-bottom:8px;line-height:1.3}
  .sub{color:var(--dim);font-size:14px;margin-bottom:24px;line-height:1.6}
  .msg{margin-bottom:16px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5;display:none;text-align:left}
  .msg.ok{display:block;background:rgba(63,185,80,.08);border:1px solid var(--green);color:var(--green)}
  .msg.err{display:block;background:rgba(224,36,36,.08);border:1px solid var(--red);color:#ff7b72}
  .msg.info{display:block;background:rgba(139,139,144,.08);border:1px solid var(--dim);color:var(--dim)}
  .op-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--card2);color:var(--gold);border:1px solid var(--gold);border-radius:12px;padding:14px 0;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;margin-top:8px}
  .op-btn:hover{background:#2a2a2d;border-color:#f7d567}
  .op-btn .u-ico{width:22px;height:22px;flex-shrink:0}
  .tip{margin-top:20px;font-size:12px;color:var(--dim);line-height:1.7}
  .tip b{color:var(--txt);font-weight:600}
  .avatar{width:96px;height:96px;border-radius:50%;border:3px solid var(--gold);margin:8px auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card2)}
  .avatar span{font-size:42px;font-weight:900;color:var(--gold)}
  .uname{font-size:22px;font-weight:700;word-break:break-all}
  .ulogin{color:var(--dim);font-size:14px;margin:6px 0 10px;word-break:break-all}
  .ustat{display:inline-block;font-size:12px;color:var(--green);border:1px solid var(--green);border-radius:20px;padding:4px 14px;margin-top:4px}
  .token-box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px 14px;font-size:12px;color:var(--dim);text-align:left;margin-top:18px;word-break:break-all;line-height:1.8}
  .token-box b{color:var(--txt);font-weight:600}
  .token-box .cp{color:var(--gold);font-size:11px;cursor:pointer;float:right;margin-left:8px}
  .token-box .cp:hover{text-decoration:underline}
  .logout-btn{margin-top:24px;background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:12px;padding:12px 0;width:100%;cursor:pointer;font-size:15px;transition:.15s}
  .logout-btn:hover{color:var(--red);border-color:var(--red)}
  .hidden{display:none!important}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">OAuth 授权登录</div>
    <h1 id="title">登录 UTAU 配布站</h1>
    <p class="sub" id="sub">通过 UTAU 开放平台 OAuth 2.0 授权登录</p>

    <div id="msgBox"></div>

    <div id="viewGuest">
      <a class="op-btn" id="opLoginBtn">
        <svg class="u-ico" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#f5c542" stroke-width="6"/><text x="50" y="68" font-size="48" text-anchor="middle" fill="#f5c542" font-family="Arial" font-weight="900">U</text></svg>
        <span>使用 UTAU 开放平台授权登录</span>
      </a>
      <div class="tip">
        <b>流程：</b>点击后跳转开放平台授权页 →<br>输入管理站 Token 确认授权 → 自动回到本站并显示令牌。
      </div>
    </div>

    <div id="viewUser" class="hidden">
      <div class="avatar"><span>U</span></div>
      <div class="uname" id="uName">UTAU 配布站管理员</div>
      <div class="ulogin" id="uLogin"></div>
      <div><span class="ustat">已通过开放平台登录</span></div>
      <div class="token-box" id="tokenBox"></div>
      <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
  </div>

<script>
(function(){
  // 本应用的 OAuth 凭证（开放平台注册时分配）
  const API = "https://utau-4oo.pages.dev";
  const AUTH_PAGE = "https://songyuheng800.github.io/utau/openplatform/authorize.html";
  const CLIENT_ID = "29c96d4cba30352235c4cc2e75bf633e";
  const CLIENT_SECRET = "M4OSGVGZZJ4SAHLL1NLNDZT43KZLVYET";
  const REDIRECT_URI = "https://songyuheng800.github.io/utau/login/";
  const SCOPE = "read";

  const $ = (id) => document.getElementById(id);
  const msgBox = $("msgBox");
  const showMsg = (type, text) => {
    msgBox.className = "msg " + type;
    msgBox.textContent = text;
  };

  let tokens = null;

  function renderUser(user) {
    $("viewGuest").classList.add("hidden");
    $("viewUser").classList.remove("hidden");
    $("uName").textContent = (user && user.name) ? user.name : "UTAU 配布站管理员";
    $("uLogin").textContent = "@" + ((user && user.id) ? user.id : "admin") + " · 经开放平台 OAuth 授权";
    $("title").textContent = "欢迎，" + $("uName").textContent;
    $("sub").textContent = "当前通过 UTAU 开放平台授权登录";
    if (tokens) {
      $("tokenBox").innerHTML =
        "<b>access_token</b>：" + tokens.access_token +
        '<span class="cp" id="cpAt">点击复制</span><br>' +
        "<b>refresh_token</b>：" + tokens.refresh_token + "<br>" +
        "<b>scope</b>：" + (tokens.scope || SCOPE);
      $("cpAt").onclick = () => {
        navigator.clipboard && navigator.clipboard.writeText(tokens.access_token).then(() => {
          $("cpAt").textContent = "已复制";
          setTimeout(() => $("cpAt").textContent = "点击复制", 1500);
        });
      };
    }
  }

  // 1) 发起登录
  $("opLoginBtn").addEventListener("click", () => {
    const state = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
    localStorage.setItem("utau_login_oauth_state", state);
    const url = AUTH_PAGE + "?client_id=" + encodeURIComponent(CLIENT_ID) +
      "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
      "&scope=" + encodeURIComponent(SCOPE) +
      "&state=" + encodeURIComponent(state);
    location.href = url;
  });

  // 2) 回跳处理
  async function handleCallback() {
    const p = new URLSearchParams(location.search);
    const code = p.get("code");
    const state = p.get("state");
    const err = p.get("error");
    if (err) return showMsg("err", "授权失败：" + err);
    if (!code) return;
    if (!state || state !== localStorage.getItem("utau_login_oauth_state")) {
      return showMsg("err", "state 校验失败（防 CSRF），请重新登录");
    }
    localStorage.removeItem("utau_login_oauth_state");
    history.replaceState(null, "", location.pathname);

    showMsg("info", "授权成功，正在换取令牌…");
    try {
      // 3) 授权码换令牌（真实后端换取，不伪造）
      const t = await fetch(API + "/api/openplatform/oauth/token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grant_type: "authorization_code",
          client_id: CLIENT_ID,
          client_secret: CLIENT_SECRET,
          code,
          redirect_uri: REDIRECT_URI,
        }),
      });
      const td = await t.json();
      if (!td.ok) return showMsg("err", "换取令牌失败：" + (td.msg || "未知错误"));
      tokens = { access_token: td.access_token, refresh_token: td.refresh_token, scope: td.scope };

      // 4) 用 access_token 调 userinfo
      const u = await fetch(API + "/api/openplatform/api/userinfo", {
        headers: { Authorization: "Bearer " + td.access_token },
      });
      const ud = await u.json();
      if (!ud.ok) return showMsg("err", "获取用户信息失败：" + (ud.msg || "未知错误"));

      showMsg("ok", "登录成功！");
      renderUser(ud.user);
    } catch (e) {
      showMsg("err", "网络错误：" + e.message);
    }
  }

  // 退出登录
  $("logoutBtn").addEventListener("click", () => {
    tokens = null;
    $("viewUser").classList.add("hidden");
    $("viewGuest").classList.remove("hidden");
    $("title").textContent = "登录 UTAU 配布站";
    $("sub").textContent = "通过 UTAU 开放平台 OAuth 2.0 授权登录";
    showMsg("info", "你已退出登录。");
    history.replaceState(null, "", location.pathname);
  });

  handleCallback();
})();
</script>
</body>
</html>
