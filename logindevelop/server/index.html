<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 安全：限制资源来源、禁止被嵌套（防点击劫持）、收紧 Referer -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://utau-catbox-test.pages.dev; frame-ancestors 'none'; base-uri 'self'">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="Referrer-Policy" content="strict-origin-when-cross-origin">
<title>服务器配置 - UTAU 开发者平台</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --card2: #21262d;
    --line: #30363d; --text: #e6edf3; --dim: #8b949e;
    --gold: #f5c542; --blue: #58a6ff; --green: #3fb950; --red: #f85149;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
  a { color: var(--blue); text-decoration: none; }

  .nav { background: var(--card); border-bottom: 1px solid var(--line); padding: 0 24px; position: sticky; top: 0; z-index: 100; }
  .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { font-size: 20px; font-weight: 800; }
  .logo span { color: var(--gold); }
  .nav-links { display: flex; gap: 24px; }
  .nav-links a { color: var(--dim); font-size: 14px; }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }

  .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .page-title { font-size: 28px; margin-bottom: 8px; }
  .page-desc { color: var(--dim); margin-bottom: 32px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 14px; background: var(--card2);
    border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  .form-group input:focus { border-color: var(--gold); }
  .form-group .hint { font-size: 12px; color: var(--dim); margin-top: 4px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }

  .btn { display: inline-block; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
  .btn-gold { background: var(--gold); color: #111; }
  .btn-gold:hover { background: #f7d567; }
  .btn-outline { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
  .btn-row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

  .status-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .status-item:last-child { border-bottom: none; }
  .status-label { color: var(--dim); font-size: 14px; }
  .status-value { font-weight: 600; font-size: 14px; }
  .status-ok { color: var(--green); }
  .status-err { color: var(--red); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-green { background: rgba(63,185,80,.15); color: var(--green); }
  .badge-red { background: rgba(248,81,73,.15); color: var(--red); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--red); }

  .loading { text-align: center; padding: 40px; color: var(--dim); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="logo">UTAU<span>开发者平台</span></div>
    <div class="nav-links">
      <a href="/utau/logindevelop/">概览</a>
      <a href="/utau/logindevelop/server/" class="active">服务器配置</a>
      <a href="/utau/sensitive/">敏感词检测</a>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">服务器配置</h1>
  <p class="page-desc">实时读取后端配置，修改后保存到 KV，立即生效</p>

  <div id="loading" class="loading">正在加载配置...</div>
  <div id="content" style="display:none">

    <!-- 服务器状态 -->
    <div class="card">
      <div class="card-title">📊 实时服务器状态</div>
      <div class="status-item">
        <span class="status-label">API 连接</span>
        <span class="status-value" id="connStatus">检测中...</span>
      </div>
      <div class="status-item">
        <span class="status-label">当前环境</span>
        <span class="status-value" id="envStatus">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">已封禁账号数</span>
        <span class="status-value" id="bannedCount">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">敏感词检测</span>
        <span class="status-value" id="sensitiveStatus">-</span>
      </div>
    </div>

    <!-- 环境配置 -->
    <div class="card">
      <div class="card-title">⚙️ 环境配置</div>
      <div class="form-group">
        <label>当前环境</label>
        <select id="cfg-env">
          <option value="prod">生产环境 (Production)</option>
          <option value="dev">开发环境 (Development)</option>
          <option value="staging">预发布 (Staging)</option>
        </select>
      </div>
      <div class="row">
        <div class="form-group">
          <label>开放平台 API 地址</label>
          <input type="text" id="cfg-api-open">
        </div>
        <div class="form-group">
          <label>登录服务 API 地址</label>
          <input type="text" id="cfg-api-auth">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>前端域名</label>
          <input type="text" id="cfg-domain">
        </div>
        <div class="form-group">
          <label>默认 redirect_uri</label>
          <input type="text" id="cfg-redirect">
        </div>
      </div>
    </div>

    <!-- 安全配置 -->
    <div class="card">
      <div class="card-title">🛡️ 安全配置</div>
      <div class="status-item">
        <div><div style="font-weight:600">CORS 跨域</div></div>
        <span class="badge badge-green" id="cfg-cors">已启用</span>
      </div>
      <div class="status-item">
        <div><div style="font-weight:600">敏感词检测</div></div>
        <span class="badge badge-green" id="cfg-sensitive">已启用</span>
      </div>
      <div class="status-item">
        <div><div style="font-weight:600">HTTPS 强制</div></div>
        <span class="badge badge-green" id="cfg-https">已启用</span>
      </div>
      <div class="status-item">
        <div><div style="font-weight:600">已封禁账号</div><div class="hint" style="margin-top:2px" id="cfg-banned-list">-</div></div>
      </div>
    </div>

    <!-- 管理员凭证（保存配置必须，防未授权写入与 CSRF） -->
    <div class="card">
      <div class="card-title">🔑 管理员凭证</div>
      <div class="form-group">
        <label>管理员令牌（ADMIN_CONFIG_TOKEN）</label>
        <input type="password" id="cfg-admin-token" placeholder="保存配置时必填，仅本次提交使用，不保存到页面" autocomplete="off">
        <div class="hint">由服务端环境变量 ADMIN_CONFIG_TOKEN 配置，错误或缺失将无法保存。</div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="btn-row">
      <button class="btn btn-gold" id="saveBtn" onclick="saveConfig()">💾 保存配置</button>
      <button class="btn btn-outline" onclick="testConn()">🔌 测试连接</button>
      <button class="btn btn-outline" onclick="loadConfig()">🔄 重新加载</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://utau-catbox-test.pages.dev/api";
let cfgNonce = ""; // GET 下发的一次性配置凭证（防 CSRF/重放）

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function loadConfig() {
  try {
    const r = await fetch(API + "/server-config");
    const d = await r.json();
    if (!d.ok) throw new Error(d.msg);
    cfgNonce = d.nonce || "";
    const c = d.config;
    document.getElementById('cfg-env').value = c.env;
    document.getElementById('cfg-api-open').value = c.api_open_url;
    document.getElementById('cfg-api-auth').value = c.api_auth_url;
    document.getElementById('cfg-domain').value = c.frontend_domain;
    document.getElementById('cfg-redirect').value = c.default_redirect;
    document.getElementById('envStatus').textContent = c.env === 'prod' ? '生产环境' : c.env === 'dev' ? '开发环境' : '预发布';
    document.getElementById('bannedCount').textContent = (c.banned_accounts || []).length + ' 个';
    document.getElementById('cfg-banned-list').textContent = (c.banned_accounts || []).join('、');
    document.getElementById('cfg-cors').textContent = c.cors_enabled ? '已启用' : '已关闭';
    document.getElementById('cfg-sensitive').textContent = c.sensitive_check_enabled ? '已启用' : '已关闭';
    document.getElementById('cfg-https').textContent = c.https_force ? '已启用' : '已关闭';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    testConn();
  } catch (e) {
    showToast('加载失败: ' + e.message, true);
  }
}

async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  const token = document.getElementById('cfg-admin-token').value.trim();
  if (!token) return showToast('请先填写管理员令牌', true);
  if (!cfgNonce) return showToast('配置凭证缺失，请点「重新加载」后再保存', true);

  const apiOpen = document.getElementById('cfg-api-open').value.trim();
  const apiAuth = document.getElementById('cfg-api-auth').value.trim();
  const defRedirect = document.getElementById('cfg-redirect').value.trim();
  // URL 类字段前端预检 http/https，避免无效请求
  for (const [v, name] of [[apiOpen, '开放平台 API 地址'], [apiAuth, '登录服务 API 地址'], [defRedirect, '默认 redirect_uri']]) {
    if (!/^https?:\/\//.test(v)) return showToast(name + ' 必须是 http/https 开头的完整地址', true);
  }

  const body = {
    env: document.getElementById('cfg-env').value,
    api_open_url: apiOpen,
    api_auth_url: apiAuth,
    frontend_domain: document.getElementById('cfg-domain').value.trim(),
    default_redirect: defRedirect,
    admin_token: token,
    nonce: cfgNonce,
  };
  btn.disabled = true; const old = btn.textContent; btn.textContent = '保存中…';
  try {
    const r = await fetch(API + "/server-config", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.ok) {
      showToast('✓ 配置已保存到 KV，立即生效');
      loadConfig(); // 重新拉取新 nonce
    } else {
      showToast('保存失败: ' + (d.msg || '未知错误'), true);
    }
  } catch (e) {
    showToast('保存失败: ' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

async function testConn() {
  const el = document.getElementById('connStatus');
  el.textContent = '检测中...';
  el.className = 'status-value';
  try {
    const start = Date.now();
    const r = await fetch(API + "/oauth/providers");
    const d = await r.json();
    const ms = Date.now() - start;
    if (d.ok) {
      el.textContent = '● 正常 · ' + ms + 'ms';
      el.className = 'status-value status-ok';
    } else {
      el.textContent = '● 异常';
      el.className = 'status-value status-err';
    }
  } catch (e) {
    el.textContent = '● 连接失败';
    el.className = 'status-value status-err';
  }
}

loadConfig();
</script>
</body>
</html>
