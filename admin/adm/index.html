<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高管后台 - UTAU 配布站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
html,body{overflow-x:hidden}
body{min-height:100vh;background:linear-gradient(160deg,#e8f0f8 0%,#f0f5fa 50%,#e8eef5 100%)}
.login-page{min-height:100vh;padding:20px;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:20px;padding:36px 24px 32px;width:100%;box-shadow:0 20px 60px rgba(74,127,181,0.12)}
.logo{text-align:center;margin-bottom:16px}
.logo img{width:100px;height:auto;display:block;margin:0 auto}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0 24px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#ddd}
.divider span{color:#555;font-size:14px;white-space:nowrap}
.field{margin-bottom:18px}
.field label{display:block;font-size:14px;color:#333;margin-bottom:8px;font-weight:500}
.field input{width:100%;padding:14px 16px;border:1.5px solid #e0e0e0;border-radius:10px;background:#f5f5f5;font-size:15px;outline:none}
.field input:focus{border-color:#4a7fb5;background:#fff}
.connect-btn{width:100%;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,#6b2c2c 0%,#a83a3a 100%);color:#fff;font-size:17px;font-weight:600;cursor:pointer;margin-top:6px}
.connect-btn small{display:block;font-size:11px;font-weight:400;letter-spacing:4px;opacity:.9;margin-top:2px}
.error{color:#c0392b;font-size:13px;text-align:center;margin-top:12px;display:none}
.admin-view{max-width:800px;margin:0 auto;padding:24px 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar a{color:#2c6ba8;text-decoration:none;font-size:15px}
.topbar button{background:none;border:none;color:#888;font-size:14px;cursor:pointer}
.stats{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:16px;box-shadow:0 4px 20px rgba(74,127,181,0.08)}
.stats h1{font-size:20px;color:#222;margin-bottom:6px}
.stats-row{display:flex;gap:12px;margin-top:12px}
.stat-pill{background:#f0f5fa;border-radius:20px;padding:6px 14px;font-size:13px;color:#555}
.stat-pill b{color:#2c6ba8}
.log-list{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(74,127,181,0.08)}
.log-row{padding:12px 16px;border-bottom:1px solid #f0f0f0;font-size:13px}
.log-row:last-child{border-bottom:none}
.log-time{color:#999;font-size:12px}
.log-type{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:8px}
.type-view{background:#e8f4e8;color:#2a7a2a}
.type-dl{background:#e8eef8;color:#2c5f8a}
.log-file{color:#555}
.log-ip{color:#999;font-size:11px}
.empty{padding:40px;text-align:center;color:#aaa}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-page">
    <div class="login-wrap">
      <div class="login-card">
        <div class="logo">
          <img src="../logo.png?v=1" alt="HAAVIK">
        </div>
        <div class="divider"><span>高管凭证认证</span></div>
        <div class="field">
          <label>密码 / Password</label>
          <input type="password" id="password" placeholder="输入高管密码..." autocomplete="off">
        </div>
        <button class="connect-btn" onclick="doLogin()">
          验证
          <small>VERIFY</small>
        </button>
        <div class="error" id="loginErr">密码错误</div>
      </div>
    </div>
  </div>
</div>

<div id="adminView" style="display:none">
  <div class="topbar">
    <a href="../">← 返回管理站</a>
    <button onclick="doLogout()">退出</button>
  </div>
  <div class="stats">
    <h1>访问日志</h1>
    <div class="stats-row">
      <span class="stat-pill">总访问 <b id="totalViews">0</b></span>
      <span class="stat-pill">总下载 <b id="totalDls">0</b></span>
    </div>
  </div>
  <div class="log-list" id="logList">
    <div class="empty">加载中...</div>
  </div>
</div>

<script>
const API = "https://utau-4oo.pages.dev/upload";
const ADMIN_PASS = "233677";
let adminPwd = sessionStorage.getItem("utau_adm_pwd") || "";

function doLogin() {
  const p = document.getElementById("password").value.trim();
  const err = document.getElementById("loginErr");
  if (p !== ADMIN_PASS) { err.style.display = "block"; return; }
  err.style.display = "none";
  adminPwd = p;
  sessionStorage.setItem("utau_adm_pwd", p);
  showAdmin();
}

function showAdmin() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("adminView").style.display = "block";
  loadLogs();
}

function doLogout() {
  sessionStorage.removeItem("utau_adm_pwd");
  location.reload();
}

async function loadLogs() {
  try {
    const res = await fetch(API + "?stats=" + encodeURIComponent(adminPwd));
    const data = await res.json();
    if (!data.ok) {
      document.getElementById("logList").innerHTML = '<div class="empty">' + (data.msg || "加载失败") + '</div>';
      return;
    }
    const logs = data.logs || [];
    const views = logs.filter(l => l.type === "pageview").length;
    const dls = logs.filter(l => l.type === "download").length;
    document.getElementById("totalViews").textContent = views;
    document.getElementById("totalDls").textContent = dls;

    const list = document.getElementById("logList");
    if (logs.length === 0) {
      list.innerHTML = '<div class="empty">暂无日志记录</div>';
      return;
    }
    list.innerHTML = "";
    logs.forEach(l => {
      const row = document.createElement("div");
      row.className = "log-row";
      const d = new Date(l.time);
      const timeStr = d.toLocaleString("zh-CN", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
      const typeLabel = l.type === "download" ? "下载" : "访问";
      const typeClass = l.type === "download" ? "type-dl" : "type-view";
      row.innerHTML = `
        <div class="log-time">${timeStr}</div>
        <span class="log-type ${typeClass}">${typeLabel}</span>
        <span class="log-file">${l.file ? l.file : "页面访问"}</span>
        <div class="log-ip">IP: ${l.ip} | ${l.ua ? l.ua.substring(0,60) : ""}</div>
      `;
      list.appendChild(row);
    });
  } catch (e) {
    document.getElementById("logList").innerHTML = '<div class="empty">网络错误：' + e.message + '</div>';
  }
}

document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
if (adminPwd) showAdmin();
</script>
</body>
</html>
