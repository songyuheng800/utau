<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - UTAU 配布站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
html,body{overflow-x:hidden}
body{min-height:100vh;background:linear-gradient(160deg,#e8f0f8 0%,#f0f5fa 50%,#e8eef5 100%)}

.login-page{min-height:100vh;padding:20px;max-width:480px;margin:0 auto;display:flex;flex-direction:column}

/* 语言切换 */
.lang-wrap{position:relative;align-self:flex-start;margin-bottom:16px}
.lang-btn{padding:8px 18px;border:1.5px solid #4a7fb5;border-radius:6px;background:transparent;color:#4a7fb5;font-size:14px;cursor:pointer}
.lang-menu{display:none;position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.1);z-index:10;min-width:120px;overflow:hidden}
.lang-menu.show{display:block}
.lang-menu button{display:block;width:100%;padding:10px 16px;background:none;border:none;text-align:left;font-size:14px;cursor:pointer;color:#333}
.lang-menu button:hover{background:#f0f5fa}
.lang-menu button.active{color:#4a7fb5;font-weight:600}

.login-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:20px;padding:36px 24px 32px;width:100%;box-shadow:0 20px 60px rgba(74,127,181,0.12)}

.logo{text-align:center;margin-bottom:16px}
.logo img{width:100px;height:auto;display:block;margin:0 auto}

.divider{display:flex;align-items:center;gap:10px;margin:20px 0 24px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#ddd}
.divider span{color:#555;font-size:14px;white-space:nowrap}

.field{margin-bottom:18px}
.field label{display:block;font-size:14px;color:#333;margin-bottom:8px;font-weight:500}
.field input{width:100%;padding:14px 16px;border:1.5px solid #e0e0e0;border-radius:10px;background:#f5f5f5;font-size:15px;outline:none}
.field input:focus{border-color:#4a7fb5;background:#fff}
.field input::placeholder{color:#aaa}

.connect-btn{width:100%;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,#2c6ba8 0%,#3a82c4 100%);color:#fff;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:2px;margin-top:6px}
.connect-btn small{display:block;font-size:11px;font-weight:400;letter-spacing:4px;opacity:.9;margin-top:2px}

.error{color:#c0392b;font-size:13px;text-align:center;margin-top:12px;display:none}

.admin-view{max-width:800px;margin:0 auto;padding:24px 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.topbar a{color:#2c6ba8;text-decoration:none;font-size:15px}
.topbar button{background:none;border:none;color:#888;font-size:14px;cursor:pointer}
.stats{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:20px;box-shadow:0 4px 20px rgba(74,127,181,0.08)}
.stats h1{font-size:22px;color:#222;margin-bottom:6px}
.stats p{color:#888;font-size:14px}
.file-list{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(74,127,181,0.08)}
.file-row{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid #f0f0f0;gap:12px}
.file-row:last-child{border-bottom:none}
.file-icon{width:36px;height:36px;background:#eef4fa;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#2c6ba8;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;color:#222;word-break:break-all;line-height:1.4}
.file-meta{font-size:12px;color:#999;margin-top:2px}
.del-btn{padding:8px 14px;background:#e74c3c;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.del-btn:hover{background:#c0392b}
.dl-btn{padding:8px 14px;background:#2c6ba8;color:#fff;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none;display:inline-block}
.dl-btn:hover{background:#1e5a94}
.copy-btn{padding:8px 12px;background:#f0f0f0;color:#555;border:none;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.copy-btn:hover{background:#e0e0e0}
.empty{padding:48px;text-align:center;color:#aaa}
.search-box{width:100%;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;margin-bottom:16px;outline:none;background:#fff}
.search-box:focus{border-color:#4a7fb5}
.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-pill{background:#fff;border-radius:20px;padding:6px 16px;font-size:13px;color:#555;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.stat-pill b{color:#2c6ba8}

/* Win11 加载环 */
.boot-overlay{position:fixed;inset:0;background:#0f4b8a;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s ease;opacity:1}
.boot-overlay.fade{opacity:0;pointer-events:none}
.boot-spinner{width:56px;height:56px;position:relative;margin-bottom:28px}
.boot-spinner::before,.boot-spinner::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
.boot-spinner::before{border-top-color:#fff;border-right-color:#fff;animation:spin 0.9s linear infinite}
.boot-spinner::after{border-bottom-color:#fff;border-left-color:rgba(255,255,255,0.3);animation:spin 0.9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-msg{color:#fff;font-size:15px;letter-spacing:1px;text-align:center;padding:0 32px;min-height:24px}
</style>
</head>
<body>

<div class="boot-overlay" id="bootOverlay">
  <div class="boot-spinner"></div>
  <div class="boot-msg" id="bootMsg"></div>
</div>

<div id="loginView">
  <div class="login-page">
    <div class="lang-wrap">
      <button class="lang-btn" id="langBtn">中文 ▾</button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="zh" class="active">中文</button>
        <button data-lang="ja">日本語</button>
        <button data-lang="en">English</button>
      </div>
    </div>
    <div class="login-wrap">
      <div class="login-card">
        <div class="logo">
          <img src="logo.png?v=4" alt="HAAVIK">
        </div>
        <div class="divider"><span data-i18n="greeting">请输入管理员凭证以继续</span></div>
        <div class="field">
          <label data-i18n="userLabel">用户名 / Username</label>
          <input type="text" id="username" data-i18n-ph="userPh" placeholder="输入用户名..." autocomplete="off">
        </div>
        <div class="field">
          <label data-i18n="passLabel">密码 / Password</label>
          <input type="password" id="password" data-i18n-ph="passPh" placeholder="输入密码..." autocomplete="off">
        </div>
        <button class="connect-btn" onclick="doLogin()">
          <span data-i18n="connect">连接</span>
          <small>CONNECTION</small>
        </button>
        <div class="error" id="loginErr" data-i18n="loginErr">用户名或密码错误</div>
        <div style="text-align:center;color:#aaa;font-size:12px;margin-top:16px" data-i18n="passHint">密码提示：管理员的身份证后六位</div>
      </div>
    </div>
  </div>
</div>

<div id="adminView" style="display:none">
  <div class="topbar">
    <a href="/utau/" data-i18n="backHome">← 返回主站</a>
    <button onclick="doLogout()" data-i18n="logout">退出登录</button>
  </div>
  <div class="stats">
    <h1 data-i18n="fileMgr">文件管理</h1>
    <p><span data-i18n="totalPrefix">共</span> <span id="count">0</span> <span data-i18n="totalSuffix">个文件，删除后不可恢复</span></p>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <input type="text" class="search-box" id="searchBox" data-i18n-ph="searchPh" placeholder="搜索文件名...">
  <div class="file-list" id="fileList">
    <div class="empty" data-i18n="loading">加载中...</div>
  </div>
</div>

<script>
const API = "https://utau-4oo.pages.dev/upload";
const ADMIN_USER = "宋昱衡";
const ADMIN_PASS = "233677";
let adminPwd = sessionStorage.getItem("utau_admin_pwd") || "";

const I18N = {
  zh: { greeting:"请输入管理员凭证以继续", userLabel:"用户名 / Username", userPh:"输入用户名...", passLabel:"密码 / Password", passPh:"输入密码...", connect:"连接", loginErr:"用户名或密码错误", passHint:"密码提示：管理员的身份证后六位", backHome:"← 返回主站", logout:"退出登录", fileMgr:"文件管理", totalPrefix:"共", totalSuffix:"个文件，删除后不可恢复", loading:"加载中...", empty:"暂无文件", delete:"删除", download:"下载", copy:"复制", copied:"已复制", searchPh:"搜索文件名...", confirmDel:"确定删除「", delOk:"已删除", delFail:"删除失败：", netErr:"网络错误：", cat_utau:"UTAU工程", cat_ustx:"OpenUTAU工程", cat_vocaloid:"Vocaloid工程", cat_voicebank:"声库" },
  ja: { greeting:"管理者認証情報を入力してください", userLabel:"ユーザー名 / Username", userPh:"ユーザー名を入力...", passLabel:"パスワード / Password", passPh:"パスワードを入力...", connect:"接続", loginErr:"ユーザー名またはパスワードが違います", passHint:"パスワードのヒント：管理者の身分証明書の下6桁", backHome:"← ホームに戻る", logout:"ログアウト", fileMgr:"ファイル管理", totalPrefix:"計", totalSuffix:"件、削除は復元不可です", loading:"読み込み中...", empty:"ファイルなし", delete:"削除", download:"ダウンロード", copy:"コピー", copied:"コピー済み", searchPh:"ファイル名を検索...", confirmDel:"「", delOk:"削除しました", delFail:"削除失敗：", netErr:"ネットワークエラー：", cat_utau:"UTAUプロジェクト", cat_ustx:"OpenUTAUプロジェクト", cat_vocaloid:"Vocaloidプロジェクト", cat_voicebank:"ボイスバンク" },
  en: { greeting:"Enter admin credentials to continue", userLabel:"Username", userPh:"Enter username...", passLabel:"Password", passPh:"Enter password...", connect:"Connect", loginErr:"Invalid username or password", passHint:"Password hint: last 6 digits of admin ID", backHome:"← Back to home", logout:"Log out", fileMgr:"File Manager", totalPrefix:"", totalSuffix:"files total, deletion is permanent", loading:"Loading...", empty:"No files", delete:"Delete", download:"Download", copy:"Copy", copied:"Copied", searchPh:"Search files...", confirmDel:"Are you sure to delete \"", delOk:"Deleted", delFail:"Delete failed: ", netErr:"Network error: ", cat_utau:"UTAU project", cat_ustx:"OpenUTAU project", cat_vocaloid:"Vocaloid project", cat_voicebank:"Voicebank" }
};

let lang = localStorage.getItem("utau_admin_lang") || "zh";

function applyLang() {
  const t = I18N[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const key = el.getAttribute("data-i18n-ph");
    if (t[key]) el.placeholder = t[key];
  });
  document.getElementById("langBtn").textContent = (lang === "zh" ? "中文" : lang === "ja" ? "日本語" : "English") + " ▾";
  document.querySelectorAll("#langMenu button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang === "ja" ? "ja" : "en";
  // 刷新文件列表中的翻译
  if (document.getElementById("adminView").style.display === "block") loadFiles();
}

document.getElementById("langBtn").onclick = (e) => {
  e.stopPropagation();
  e.preventDefault();
  document.getElementById("langMenu").classList.toggle("show");
};
document.querySelectorAll("#langMenu button").forEach(b => {
  b.onclick = (e) => {
    e.stopPropagation();
    lang = b.dataset.lang;
    localStorage.setItem("utau_admin_lang", lang);
    document.getElementById("langMenu").classList.remove("show");
    applyLang();
  };
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".lang-wrap")) {
    document.getElementById("langMenu").classList.remove("show");
  }
});

function doLogin() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const err = document.getElementById("loginErr");
  err.style.display = "none";

  const isCorrect = (["admin","宋昱衡","1"].includes(u) && p === ADMIN_PASS);

  // 加载文字多语言
  const bootMsgs = {
    zh: ["正在检验账户信息...","正在核验系统...","正在初始化...","正在开启服务器...","正在维护主站/副站生态...","服务器接入，准备进入系统...","服务器已启动"],
    ja: ["アカウント情報を確認中...","システムを検証中...","初期化中...","サーバーを起動中...","メイン/サブサイトを維持中...","サーバー接続、システム準備中...","サーバー起動完了"],
    en: ["Verifying account info...","Checking system...","Initializing...","Starting server...","Maintaining main/backup sites...","Server connected, preparing...","Server started"]
  };
  const msgs = bootMsgs[lang] || bootMsgs.zh;

  const overlay = document.getElementById("bootOverlay");
  const msg = document.getElementById("bootMsg");
  overlay.style.display = "flex";
  overlay.classList.remove("fade");

  if (!isCorrect) {
    // 密码错误：1.5秒后退出
    msg.textContent = msgs[0];
    setTimeout(() => {
      msg.textContent = lang === "zh" ? "认证失败" : lang === "ja" ? "認証失敗" : "Authentication failed";
      setTimeout(() => {
        overlay.classList.add("fade");
        setTimeout(() => { overlay.style.display = "none"; }, 1200);
        err.style.display = "block";
      }, 800);
    }, 1500);
    return;
  }

  // 密码正确：完整10秒启动序列
  const steps = [[0,0],[1500,1],[3000,2],[4500,3],[6000,4],[7500,5],[9000,6]];
  steps.forEach(([delay, idx]) => {
    setTimeout(() => { msg.textContent = msgs[idx]; }, delay);
  });

  setTimeout(() => {
    overlay.classList.add("fade");
    setTimeout(() => {
      overlay.style.display = "none";
      adminPwd = p;
      sessionStorage.setItem("utau_admin_pwd", p);
      showAdmin();
    }, 1200);
  }, 10000);
}

function showAdmin() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("adminView").style.display = "block";
  loadFiles();
}

function doLogout() {
  sessionStorage.removeItem("utau_admin_pwd");
  location.reload();
}

function extOf(name) { return name.split(".").pop().toLowerCase(); }
function catKey(ext) {
  if (ext === "ust") return "cat_utau";
  if (ext === "ustx") return "cat_ustx";
  if (["vsq","vsqx","vpr","pp2","pp3"].includes(ext)) return "cat_vocaloid";
  if (["zip","rar"].includes(ext)) return "cat_voicebank";
  return "cat_utau";
}

let allFiles = [];

async function loadFiles() {
  const t = I18N[lang];
  try {
    const res = await fetch(API + "?list=1");
    const data = await res.json();
    allFiles = data.files || [];
    document.getElementById("count").textContent = allFiles.length;
    renderStats(allFiles);
    renderList(allFiles);
  } catch (e) {
    document.getElementById("fileList").innerHTML = '<div class="empty">' + I18N[lang].netErr + e.message + '</div>';
  }
}

function renderStats(files) {
  const t = I18N[lang];
  const counts = { cat_utau:0, cat_ustx:0, cat_vocaloid:0, cat_voicebank:0 };
  files.forEach(f => { counts[catKey(extOf(f.name))]++; });
  document.getElementById("statsRow").innerHTML =
    '<span class="stat-pill">' + t.cat_utau + ' <b>' + counts.cat_utau + '</b></span>' +
    '<span class="stat-pill">' + t.cat_ustx + ' <b>' + counts.cat_ustx + '</b></span>' +
    '<span class="stat-pill">' + t.cat_vocaloid + ' <b>' + counts.cat_vocaloid + '</b></span>' +
    '<span class="stat-pill">' + t.cat_voicebank + ' <b>' + counts.cat_voicebank + '</b></span>';
}

function renderList(files) {
  const t = I18N[lang];
  const list = document.getElementById("fileList");
  if (files.length === 0) {
    list.innerHTML = '<div class="empty">' + t.empty + '</div>';
    return;
  }
  list.innerHTML = "";
  files.forEach(f => {
    const ext = extOf(f.name);
    const row = document.createElement("div");
    row.className = "file-row";
    row.innerHTML = `
      <div class="file-icon">${ext.toUpperCase()}</div>
      <div class="file-info">
        <div class="file-name"></div>
        <div class="file-meta">${t[catKey(ext)]}</div>
      </div>
      <a class="dl-btn" href="${API}?download=${encodeURIComponent(f.name)}" download>${t.download}</a>
      <button class="copy-btn">${t.copy}</button>
      <button class="del-btn">${t.delete}</button>
    `;
    row.querySelector(".file-name").textContent = f.name;
    row.querySelector(".del-btn").onclick = () => doDelete(f.name, row);
    row.querySelector(".copy-btn").onclick = async (e) => {
      try {
        await navigator.clipboard.writeText(f.raw);
        e.target.textContent = "✓";
        setTimeout(() => { e.target.textContent = "⧉"; }, 1200);
      } catch(err) { alert(f.raw); }
    };
    list.appendChild(row);
  });
}

// 搜索过滤
document.getElementById("searchBox").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase().trim();
  const filtered = q ? allFiles.filter(f => f.name.toLowerCase().includes(q)) : allFiles;
  renderList(filtered);
});

async function doDelete(filename, rowEl) {
  const t = I18N[lang];
  if (!confirm(t.confirmDel + filename + "\"?")) return;
  try {
    const res = await fetch(API, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: filename, password: adminPwd })
    });
    const data = await res.json();
    if (data.ok) {
      rowEl.remove();
      document.getElementById("count").textContent =
        parseInt(document.getElementById("count").textContent) - 1;
    } else {
      alert(t.delFail + (data.msg || ""));
    }
  } catch (e) {
    alert(t.netErr + e.message);
  }
}

document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
document.getElementById("username").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("password").focus(); });

applyLang();
if (adminPwd) showAdmin();
</script>
</body>
</html>
