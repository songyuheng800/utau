<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - UTAU 配布站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:linear-gradient(160deg,#e8f0f8 0%,#f0f5fa 50%,#e8eef5 100%)}

/* 语言选择按钮 */
.lang-btn{position:absolute;top:40px;left:30px;padding:8px 20px;border:1.5px solid #4a7fb5;border-radius:6px;background:transparent;color:#4a7fb5;font-size:15px;cursor:pointer}

/* 登录卡片 */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:#fff;border-radius:24px;padding:48px 36px 40px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(74,127,181,0.12)}

/* Logo */
.logo{text-align:center;margin-bottom:20px}
.logo img{width:110px;height:auto;display:block;margin:0 auto}
.logo-text{font-size:28px;font-weight:800;color:#2c5f8a;letter-spacing:6px;margin-top:8px}

/* 分隔线 */
.divider{display:flex;align-items:center;gap:12px;margin:24px 0 28px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#ddd}
.divider span{color:#555;font-size:15px;white-space:nowrap}

/* 表单 */
.field{margin-bottom:22px}
.field label{display:block;font-size:15px;color:#333;margin-bottom:10px;font-weight:500}
.field input{width:100%;padding:16px 18px;border:1.5px solid #e0e0e0;border-radius:12px;background:#f5f5f5;font-size:16px;outline:none;transition:border .2s}
.field input:focus{border-color:#4a7fb5;background:#fff}
.field input::placeholder{color:#aaa}

/* 连接按钮 */
.connect-btn{width:100%;padding:18px;border:none;border-radius:12px;background:linear-gradient(135deg,#2c6ba8 0%,#3a82c4 100%);color:#fff;font-size:18px;font-weight:600;cursor:pointer;letter-spacing:2px;margin-top:8px}
.connect-btn small{display:block;font-size:12px;font-weight:400;letter-spacing:4px;opacity:.9;margin-top:2px}

.error{color:#c0392b;font-size:14px;text-align:center;margin-top:14px;display:none}

/* ===== 管理视图 ===== */
.admin-view{max-width:800px;margin:0 auto;padding:24px 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.topbar a{color:#2c6ba8;text-decoration:none;font-size:15px}
.topbar button{background:none;border:none;color:#888;font-size:14px;cursor:pointer}

.stats{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:20px;box-shadow:0 4px 20px rgba(74,127,181,0.08)}
.stats h1{font-size:22px;color:#222;margin-bottom:6px}
.stats p{color:#888;font-size:14px}

.file-list{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(74,127,181,0.08)}
.file-row{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid #f0f0f0;gap:12px}
.file-row:last-child{border-bottom:none}
.file-icon{width:36px;height:36px;background:#eef4fa;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#2c6ba8;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;color:#222;word-break:break-all;line-height:1.4}
.file-meta{font-size:12px;color:#999;margin-top:2px}
.del-btn{padding:8px 18px;background:#e74c3c;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.del-btn:hover{background:#c0392b}
.empty{padding:48px;text-align:center;color:#aaa}
</style>
</head>
<body>

<!-- ===== 登录视图 ===== -->
<div id="loginView">
  <button class="lang-btn">中文 ▾</button>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">
        <img src="logo.png?v=2" alt="HAAVIK">
      </div>
      <div class="divider"><span>请输入管理员凭证以继续</span></div>
      <div class="field">
        <label>用户名 / Username</label>
        <input type="text" id="username" placeholder="输入用户名..." autocomplete="off">
      </div>
      <div class="field">
        <label>密码 / Password</label>
        <input type="password" id="password" placeholder="输入密码..." autocomplete="off">
      </div>
      <button class="connect-btn" onclick="doLogin()">
        连接
        <small>CONNECTION</small>
      </button>
      <div class="error" id="loginErr">用户名或密码错误</div>
      <div style="text-align:center;color:#aaa;font-size:12px;margin-top:16px">密码提示：管理员的身份证后六位</div>
    </div>
  </div>
</div>

<!-- ===== 管理视图 ===== -->
<div id="adminView" style="display:none">
  <div class="topbar">
    <a href="/utau/">← 返回主站</a>
    <button onclick="doLogout()">退出登录</button>
  </div>
  <div class="stats">
    <h1>文件管理</h1>
    <p>共 <span id="count">0</span> 个文件，删除后不可恢复</p>
  </div>
  <div class="file-list" id="fileList">
    <div class="empty">加载中...</div>
  </div>
</div>

<script>
const API = "https://utau-4oo.pages.dev/upload";
const ADMIN_USER = "宋昱衡";
const ADMIN_PASS = "233677";
let adminPwd = sessionStorage.getItem("utau_admin_pwd") || "";

function doLogin() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const err = document.getElementById("loginErr");
  if (!u || !p) { err.style.display = "block"; return; }
  if (u !== ADMIN_USER || p !== ADMIN_PASS) { err.style.display = "block"; return; }
  err.style.display = "none";
  adminPwd = p;
  sessionStorage.setItem("utau_admin_pwd", p);
  showAdmin();
}

function showAdmin() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("adminView").style.display = "block";
  loadFiles();
}

function doLogout() {
  sessionStorage.removeItem("utau_admin_pwd");
  location.reload();
}

function extOf(name) {
  return name.split(".").pop().toLowerCase();
}
function catOf(ext) {
  if (ext === "ust") return "UTAU";
  if (ext === "ustx") return "OpenUTAU";
  if (["vsq","vsqx","vpr","pp2","pp3"].includes(ext)) return "Vocaloid";
  if (["zip","rar"].includes(ext)) return "声库";
  return "其他";
}

async function loadFiles() {
  try {
    const res = await fetch(API + "?list=1");
    const data = await res.json();
    const files = data.files || [];
    document.getElementById("count").textContent = files.length;
    const list = document.getElementById("fileList");
    if (files.length === 0) {
      list.innerHTML = '<div class="empty">暂无文件</div>';
      return;
    }
    list.innerHTML = "";
    files.forEach(f => {
      const ext = extOf(f.name);
      const row = document.createElement("div");
      row.className = "file-row";
      row.innerHTML = `
        <div class="file-icon">${ext.toUpperCase()}</div>
        <div class="file-info">
          <div class="file-name"></div>
          <div class="file-meta">${catOf(ext)} 工程</div>
        </div>
        <button class="del-btn">删除</button>
      `;
      row.querySelector(".file-name").textContent = f.name;
      row.querySelector(".del-btn").onclick = () => doDelete(f.name, row);
      list.appendChild(row);
    });
  } catch (e) {
    document.getElementById("fileList").innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
  }
}

async function doDelete(filename, rowEl) {
  if (!confirm("确定删除「" + filename + "」？")) return;
  try {
    const res = await fetch(API, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: filename, password: adminPwd })
    });
    const data = await res.json();
    if (data.ok) {
      rowEl.remove();
      document.getElementById("count").textContent =
        parseInt(document.getElementById("count").textContent) - 1;
    } else {
      alert("删除失败：" + (data.msg || "未知错误"));
    }
  } catch (e) {
    alert("网络错误：" + e.message);
  }
}

// 回车登录
document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});
document.getElementById("username").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("password").focus();
});

// 已登录则直接进入
if (adminPwd) showAdmin();
</script>
</body>
</html>
